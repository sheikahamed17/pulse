# DEMO config — the public, shared, read-mostly demo at
# pulse-demo.<subdomain>.workers.dev.
#
# It runs the SAME application code as production; the ONLY differences are the
# resource bindings below and DEMO_MODE. The safety-critical facts:
#   - the D1 id and R2 bucket are the DEMO's own, DISTINCT from production
#     (prod is df509c20-… / pulse-receipts).
#   - DEMO_MODE = "true" turns on the shared auto-auth demo user, canned AI
#     (no Groq quota), disabled ingest/push/export, and the 4-hour reset cron.
# Every destructive path (seed wipe, reset cron) ALSO checks DEMO_MODE
# independently, so even a misconfiguration here cannot touch production.

name = "pulse-demo"
main = "worker.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pulse-demo"
database_id = "4ddd8b24-1ecd-4c50-bb8e-74ca652018ec"   # DEMO — NOT prod's df509c20-ed81-4146-941f-6e48e7f1f925
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "pulse-demo-receipts"                     # DEMO — NOT prod's pulse-receipts

[observability]
enabled = true

[triggers]
# Demo reset ONLY — every 4 hours. (Prod's 5 crons are NOT run here.)
crons = ["0 */4 * * *"]

[vars]
EMAIL_FROM = "Pulse Demo <onboarding@resend.dev>"
DEMO_MODE = "true"
