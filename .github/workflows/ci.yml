name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase-0]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Catch production-build failures (e.g. a useSearchParams/CSR-bailout that
      # `next build` rejects during static prerender) on every push/PR — these
      # are invisible to lint/typecheck/test and previously only surfaced at
      # deploy time, silently blocking releases.
      - name: Build
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: pnpm build
