name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase-0]

# Least-privilege GITHUB_TOKEN: CI only checks out code and runs pnpm — it never
# writes to the repo. Explicit top-level permissions satisfy CodeQL's
# actions/missing-workflow-permissions rule (the default token is over-scoped).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Apply every migration in order to a fresh, throwaway LOCAL D1 (a SQLite
      # file under .wrangler/, created on the runner). This catches a broken or
      # out-of-order migration — bad SQL, a column added twice, a typo'd table —
      # BEFORE it can reach the real database on deploy. No API token and no
      # database_id are needed for --local, so it runs on every PR (including
      # forks). `db:migrate:local` = `wrangler d1 migrations apply DB --local`.
      - name: Validate D1 migrations (ephemeral local DB)
        run: pnpm db:migrate:local

      # Catch production-build failures (e.g. a useSearchParams/CSR-bailout that
      # `next build` rejects during static prerender) on every push/PR — these
      # are invisible to lint/typecheck/test and previously only surfaced at
      # deploy time, silently blocking releases.
      - name: Build
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: pnpm build
